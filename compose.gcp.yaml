# CPU-only, private model service. Merge with compose.yaml; no public ports.
services:
  api:
    environment:
      ATTENDX_LOCAL_ONLY: "true"
      ATTENDX_WORKER_CONCURRENCY: "1"
      ATTENDX_MODEL_TIMEOUT_MS: "600000"
      ATTENDX_MODEL_MAX_TOKENS: "1024"
      ATTENDX_LOCAL_MAX_CALLS_PER_PROJECT: "200"
      ATTENDX_MODEL_BASE_URL: http://ollama:11434/v1
      ATTENDX_MODEL: ${ATTENDX_MODEL:-qwen2.5-coder:3b}
      ATTENDX_MODEL_LOCAL: "true"
      ATTENDX_MODEL_API_KEY: ""
    depends_on:
      model-init:
        condition: service_completed_successfully

  ollama:
    image: attendx-ollama:local
    build:
      context: ./deploy/gcp
      dockerfile: Ollama.Dockerfile
    environment:
      HOME: /tmp
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - attendx_models:/models
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 8g
    cpus: 2.75
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/ollama", "list"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6

  model-init:
    image: attendx-ollama:local
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      HOME: /tmp
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${ATTENDX_MODEL:-qwen2.5-coder:3b}"]
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 128m
    restart: "no"

volumes:
  attendx_models:
