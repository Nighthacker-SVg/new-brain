name: attendx

services:
  web:
    image: attendx-office:local
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:${ATTENDX_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 1.0
    restart: unless-stopped
